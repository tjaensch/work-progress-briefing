name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Scrub check (generic patterns only; the private list is local)
        run: python scripts/check_scrub.py --generic-only --history
      - name: Install
        run: python -m pip install pytest
      - name: Tests
        run: python -m pytest -q
